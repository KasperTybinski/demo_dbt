version: 2

models:
  - name: fact_track
    columns:
      - name: track_id
        data_tests: [unique, not_null]
      - name: album_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_album')
                field: album_id
      - name: genre_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_genre')
                field: genre_id
  - name: dim_album
    columns:
      - name: album_id
        data_tests: [unique, not_null]
  - name: dim_artist
    columns:
      - name: artist_id
        data_tests: [unique, not_null]
  - name: dim_genre
    columns:
      - name: genre_id
        data_tests: [unique, not_null]
  - name: dim_media_type
    columns:
      - name: media_type_id
        data_tests: [unique, not_null]
  - name: dim_playlist
    columns:
      - name: playlist_id
        data_tests: [unique, not_null]
